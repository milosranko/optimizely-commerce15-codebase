# ASP.NET
# Build and test ASP.NET projects.
# Add steps that publish symbols, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/aspnet/build-aspnet-4

trigger:
  batch: true
  branches:
    include:
    - develop
    - main

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  nugetPackagePrefix: 'Solution.Nme'
  solution: 'Solution.sln'
  buildConfiguration: 'Release'
  buildNumber: '$(Build.BuildId)_$(Build.BuildNumber)'

steps:
- script: dotnet build $(solution) -c $(buildConfiguration)
  displayName: 'dotnet build $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'dotnet publish'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '**/StartupProject.Web.csproj'
    arguments: '-c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/Output/wwwroot'
    zipAfterPublish: false
    modifyOutputPath: false

- task: Bash@3
  inputs:
    targetType: 'inline'
    script: echo "$(buildNumber)" > $(Build.ArtifactStagingDirectory)/Output/wwwroot/wwwroot/build.txt

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/Output'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/$(nugetPackagePrefix).cms.app.$(buildNumber).nupkg'
    replaceExistingArchive: true

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/$(nugetPackagePrefix).cms.app.$(buildNumber).nupkg'
    ArtifactName: 'drop'
    publishLocation: 'Container'